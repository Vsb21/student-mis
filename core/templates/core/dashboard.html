{% extends 'base.html' %}
{% block content %}
<h3 class="mb-4">Dashboard</h3>
<div class="row g-3 mb-4">
  <div class="col-md-4"><div class="card text-bg-primary"><div class="card-body"><h6>Students</h6><h2>{{ student_count }}</h2></div></div></div>
  <div class="col-md-4"><div class="card text-bg-success"><div class="card-body"><h6>Courses</h6><h2>{{ course_count }}</h2></div></div></div>
  <div class="col-md-4"><div class="card text-bg-warning"><div class="card-body"><h6>Departments</h6><h2>{{ department_count }}</h2></div></div></div>
</div>
<div class="card">
  <div class="card-header">Recently added students</div>
  <ul class="list-group list-group-flush">
    {% for s in recent_students %}
      <li class="list-group-item"><a href="{% url 'student_detail' s.pk %}">{{ s }}</a></li>
    {% empty %}
      <li class="list-group-item text-muted">No students yet.</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
