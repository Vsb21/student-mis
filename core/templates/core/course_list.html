{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Courses</h3>
  <a class="btn btn-primary" href="{% url 'course_add' %}">Add Course</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Credits</th><th></th></tr></thead>
  <tbody>
  {% for c in courses %}
    <tr>
      <td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.department.code }}</td><td>{{ c.credits }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{% url 'course_edit' c.pk %}">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'course_delete' c.pk %}">Delete</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="5" class="text-center text-muted">No courses yet. Add departments in the Admin first.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
